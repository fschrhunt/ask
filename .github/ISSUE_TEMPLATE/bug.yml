name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command that shows it
      render: sh
  - type: textarea
    id: help
    attributes:
      label: Output of `ask --help` and `ask models`
      render: text
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and operating system

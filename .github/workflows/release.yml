name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              target="ask_${TAG}_${os}_${arch}"
              mkdir -p "dist/$target"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$target/ask" ./cmd/ask
              cp LICENSE "dist/$target/"
              tar -C "dist/$target" -czf "dist/$target.tar.gz" ask LICENSE
              rm -r "dist/$target"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes

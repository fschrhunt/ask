<text y="157"><tspan x="22.0" fill="#e6e6e6" font-weight="400">ask&#160;login-test-fail&#160;·&#160;</tspan><tspan x="206.8" fill="#3fb950" font-weight="400">ok</tspan><tspan x="232.0" fill="#7d7d7d" font-weight="400">·&#160;Sonnet&#160;5.5&#160;·&#160;1:12&#160;·&#160;1&#160;file&#160;changed&#160;·&#160;44.2k&#160;in&#160;·&#160;1.3k&#160;out&#160;·&#160;$0.14</tspan></text>
<text y="178"><tspan x="22.0" fill="#e6e6e6" font-weight="400">Fixed:&#160;the&#160;expiry&#160;is&#160;now&#160;in&#160;milliseconds.&#160;go&#160;test&#160;./auth&#160;passes.</tspan></text>
